[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-jr-companion"
version = "0.13.2"
description = "Connect the Hermes Jr. iPhone app to your Hermes agent."
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = ["aiohttp>=3.12,<4", "fastapi>=0.115,<1", "pyhpke==0.6.5"]

[project.urls]
Repository = "https://github.com/cyberculturedhq/hermes-jr-companion"
Issues = "https://github.com/cyberculturedhq/hermes-jr-companion/issues"

[project.scripts]
hermes-jr = "hermes_jr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
