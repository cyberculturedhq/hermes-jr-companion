name: Publish signed release feed
on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to publish
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release-feed
  cancel-in-progress: false
jobs:
  manifest:
    if: ${{ github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python -m pip install cryptography
      - name: Verify public release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          RELEASE_COMMIT=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          gh release view "$RELEASE_TAG" --json body --jq .body > /tmp/release-body.md
          python tools/release_manifest.py --version "${RELEASE_TAG#v}" --commit "$RELEASE_COMMIT" --body /tmp/release-body.md --output /tmp/companion-release.json
      - name: Publish and verify the persistent feed
        env:
          RELEASE_FEED_PUBLISH_TOKEN: ${{ secrets.RELEASE_FEED_PUBLISH_TOKEN }}
        run: python tools/publish_release_feed.py --manifest /tmp/companion-release.json
